<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal - Personas y Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-hover:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-5">Bienvenido al Panel de Gestión</h1>

    <div class="row justify-content-center">
        <!-- Personas -->
        <div class="col-md-5 mb-4">
            <div class="card card-hover shadow-sm text-center">
                <div class="card-body">
                    <h3 class="card-title mb-3">Personas</h3>
                    <p class="card-text">Gestiona la lista de personas y relaciones de amistad.</p>
                    <a href="/persons" class="btn btn-primary btn-lg me-2">Ver Personas</a>
                    <a href="/persons/create" class="btn btn-success btn-lg">Agregar Persona</a>
                </div>
            </div>
        </div>

        <!-- Eventos -->
        <div class="col-md-5 mb-4">
            <div class="card card-hover shadow-sm text-center">
                <div class="card-body">
                    <h3 class="card-title mb-3">Eventos</h3>
                    <p class="card-text">Gestiona la lista de eventos y asigna participantes.</p>
                    <a href="/events" class="btn btn-primary btn-lg me-2">Ver Eventos</a>
                    <a href="/events/create" class="btn btn-success btn-lg">Crear Evento</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
