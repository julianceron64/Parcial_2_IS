<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Persona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${person.id} != null ? 'Editar Persona' : 'Nueva Persona'"></h2>

    <form th:action="@{/persons/save}" th:object="${person}" method="post" class="mt-3">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{name}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Nacimiento</label>
            <input type="date" th:field="*{birthDate}" class="form-control" required/>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/persons" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
