<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Lista de Personas</h2>

    <div class="d-flex mb-3">
        <a href="/persons/create" class="btn btn-primary me-2">Nueva Persona</a>
        <a href="/friendships" class="btn btn-secondary">Relaciones</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Fecha de Nacimiento</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${persons}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.birthDate}"></td>
                <td>
                    <!-- Botón Agregar Amigo -->
                    <button type="button"
                            class="btn btn-sm btn-success"
                            data-bs-toggle="modal"
                            th:attr="data-bs-target='#addFriendModal-' + ${p.id}">
                        Agregar
                    </button>

                    <!-- Modal Agregar Amigo -->
                    <div class="modal fade" th:id="'addFriendModal-' + ${p.id}" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <form th:action="@{/friendships/add}" method="post">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Agregar amigo a <span th:text="${p.name}"></span></h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <input type="hidden" name="personGlobalId" th:value="${p.globalId}"/>

                                        <div class="mb-3">
                                            <label class="form-label">Correo</label>
                                            <input type="email" name="friendEmail" class="form-control" required/>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Teléfono</label>
                                            <input type="text" name="friendPhone" class="form-control" required/>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="submit" class="btn btn-success">Buscar y Agregar</button>
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
