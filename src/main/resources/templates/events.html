<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Lista de Eventos</h2>

    <div class="d-flex mb-3">
        <a href="/events/create" class="btn btn-primary">Nuevo Evento</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Fecha</th>
                <th>Lugar</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${events}">
                <td th:text="${e.id}"></td>
                <td th:text="${e.name}"></td>
                <td th:text="${e.date}"></td>
                <td th:text="${e.location}"></td>
                <td>
                    <!-- Botón Agregar Participante -->
                    <button type="button"
                            class="btn btn-sm btn-success"
                            data-bs-toggle="modal"
                            th:attr="data-bs-target='#addParticipantModal-' + ${e.id}">
                        Agregar Participante
                    </button>

                    <!-- Modal Agregar Participante -->
                    <div class="modal fade" th:id="'addParticipantModal-' + ${e.id}" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <form th:action="@{/events/addParticipant}" method="post">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Agregar participante a <span th:text="${e.name}"></span></h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <input type="hidden" name="eventId" th:value="${e.id}"/>

                                        <div class="mb-3">
                                            <label class="form-label">ID de Persona</label>
                                            <input type="number" name="personId" class="form-control" required/>
                                        </div>
                                        <div class="form-text">Ingresa el ID de la persona que deseas agregar al evento.</div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="submit" class="btn btn-success">Agregar</button>
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
