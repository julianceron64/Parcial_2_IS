<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Nuevo Evento</h2>

    <form th:action="@{/events/save}" th:object="${event}" method="post">
        <!-- Nombre -->
        <div class="mb-3">
            <label class="form-label">Nombre del Evento</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="Ej. Conferencia de Tecnología" required>
        </div>

        <!-- Fecha -->
        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" th:field="*{date}" class="form-control" required>
        </div>

        <!-- Lugar -->
        <div class="mb-3">
            <label class="form-label">Lugar</label>
            <input type="text" th:field="*{location}" class="form-control" placeholder="Ej. Bogotá, Auditorio Central" required>
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-between">
            <a href="/events" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Evento</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
