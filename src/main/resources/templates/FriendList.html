<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Amigos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center mb-4">👥 Lista de Amigos</h1>

    <!-- Tabla de amigos -->
    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Iteración con Thymeleaf -->
        <tr th:each="friend : ${friends}">
            <td th:text="${friend.id}"></td>
            <td th:text="${friend.name}"></td>
            <td th:text="${friend.age}"></td>
            <td th:text="${friend.email}"></td>
            <td>
                <a th:href="@{/friends/edit/{id}(id=${friend.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/friends/delete/{id}(id=${friend.id})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Botón para añadir -->
    <div class="text-end">
        <a href="/friends/new" class="btn btn-success">➕ Agregar Amigo</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
