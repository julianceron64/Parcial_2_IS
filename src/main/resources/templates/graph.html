<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Relaciones entre Personas</title>
    <script src="https://unpkg.com/neovis.js@2.0.2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f9;
            color: #333;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        #viz {
            width: 100%;
            height: 90vh;
            border-top: 2px solid #ccc;
        }
    </style>
</head>
<body>
<h1>Relaciones entre Personas</h1>
<div id="viz"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const config = {
            containerId: "viz",
            neo4j: {
                serverUrl: "bolt://localhost:7687",
                serverUser: "neo4j",
                serverPassword: "neo4j1234"
            },
            labels: {
                Person: {
                    label: "name", // ✅ propiedad correcta en Neovis 2.x
                    title_properties: ["name", "globalId"]
                }
            },
            relationships: {
                FRIEND_WITH: {
                    label: false // También puedes usar label: "tipo" si quieres mostrar algo
                }
            },
            initialCypher: `
                MATCH (n:Person)-[r:FRIEND_WITH]-(m:Person)
                RETURN n, r, m
            `
        };
        const viz = new NeoVis.default(config);

        // Cuando termina el render
        viz.registerOnEvent("completed", (e) => {
            console.log("Render completado ✅");

            // Ejecutamos la query otra vez, pero manual, para inspeccionar resultados
            viz._driver.session().run(`
                MATCH (n:Person)-[r:FRIEND_WITH]-(m:Person)
                RETURN n, r, m
            `).then(result => {
                console.log("Resultados Cypher:", result.records.map(r => r.toObject()));
            });
        });

        viz.render();
    });
</script>
</body>
</html>
